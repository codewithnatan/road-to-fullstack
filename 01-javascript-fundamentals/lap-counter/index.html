<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lap Counter</title>
    <!-- Veerbindung zu CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <h1>Lap Counter</h1>
        <button id="btn-runde">Nächste Runde</button>
        <p>Runde: <span id="rundenAnzeige">0</span></p>

        <button id="btn-speichern">Speichern</button>
        <button id="btn-zurueck">Zurücksetzen</button>

        <h2>Meine Runden</h2>
        <ul id="rundenListe"></ul>
    </main>

    <!-- Verbindung zu JS -->
    <script src="app.js"></script>
</body>

</html>
