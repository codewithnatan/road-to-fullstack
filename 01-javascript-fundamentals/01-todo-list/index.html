<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Meeta-Daten -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do Liste</title>

    <!-- Verknüpfung zu CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Hauptbereich -->
    <main>

        <section>
            <H1>To Do Liste</H1>
            <input id="eingabefeld" type="text" placeholder="Hier eingeben">
            <button id="btn">Hinzufügen</button>

            <h2>Meine Notizen</h2>
            <p>Aufgaben: <span id="aufgabenZahl">0</span></p>
            <button id="btnLoeschen">Liste Löschen</button>
            <ul id="toDoListe"></ul>
        </section>

    </main>

    <!-- Vrknüpfung zu JavaScript -->
    <script src="app.js"></script>
</body>

</html>
